<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="A 3D configurator for creating your own custom bottle of whiskey, rum, gin, or vodka by Spirits Studio."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=replay" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Special+Gothic+Condensed+One&display=swap"
      rel="stylesheet"
    />
    <title>Spirit Studio's Create Your Own Bottle</title>

    <script>
      (function () {
        var nativeConsole = window.console || {};
        var noop = function () {};
        var gatedMethods = [
          'log',
          'debug',
          'info',
          'warn',
          'error',
          'trace',
          'group',
          'groupCollapsed',
          'groupEnd',
          'dir',
          'dirxml',
          'table',
          'assert'
        ];

        var readDebugFlag = function () {
          try {
            var params = new URLSearchParams(window.location.search || '');
            var value = String(params.get('debug') || '').toLowerCase();
            return value === 'true' || value === '1';
          } catch (e) {
            return false;
          }
        };

        var bindConsoleMethod = function (name) {
          var method = nativeConsole[name];
          return typeof method === 'function' ? method.bind(nativeConsole) : noop;
        };

        window.__SS_NATIVE_CONSOLE__ = window.__SS_NATIVE_CONSOLE__ || {};

        gatedMethods.forEach(function (name) {
          if (!window.__SS_NATIVE_CONSOLE__[name]) {
            window.__SS_NATIVE_CONSOLE__[name] = bindConsoleMethod(name);
          }
        });

        window.__SS_SYNC_DEBUG__ = function () {
          var enabled = readDebugFlag();
          window.__SS_DEBUG__ = enabled;
          return enabled;
        };

        window.__SS_SYNC_DEBUG__();

        gatedMethods.forEach(function (name) {
          var nativeMethod = window.__SS_NATIVE_CONSOLE__[name] || noop;

          if (name === 'assert') {
            console[name] = function (condition) {
              if (!window.__SS_SYNC_DEBUG__() || condition) return;
              return nativeMethod.apply(nativeConsole, arguments);
            };
            return;
          }

          console[name] = function () {
            if (!window.__SS_SYNC_DEBUG__()) return;
            return nativeMethod.apply(nativeConsole, arguments);
          };
        });
      })();
    </script>

    <!-- Zakeke globals must load BEFORE the React bundle so window.BABYLON exists -->
    <script src="%PUBLIC_URL%/globals0.js"></script>
    <script src="%PUBLIC_URL%/globals1.js"></script>
    <script src="%PUBLIC_URL%/globals2.js"></script>
    <script src="%PUBLIC_URL%/globals3.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
